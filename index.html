<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <!-- 添加到主屏幕后全屏运行 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>三国志·曹操传</title>
  <style>
    html, body {
      margin: 0; height: 100%; height: 100dvh; background: #0d0a07; overflow: hidden;
      /* 触屏：禁止页面缩放、下拉刷新 / 越界回弹、长按菜单与文字选择 */
      overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    #game { width: 100%; height: 100%; height: 100dvh; display: flex; align-items: center; justify-content: center; touch-action: none; }
    /* 竖屏遮罩：只在触屏设备竖屏时显示 */
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 100; background: #0d0a07; color: #e9c46a;
      flex-direction: column; align-items: center; justify-content: center; text-align: center;
      font: 24px/1.8 "STKaiti","KaiTi","Kaiti SC","PingFang SC","Microsoft YaHei",serif;
    }
    #rotate .icon { font-size: 56px; line-height: 1.2; margin-bottom: 12px; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    /* 全屏按钮：触屏且浏览器支持全屏时由 main.js 显示；左下角，手机横屏时落在画面左侧黑边上 */
    #fs-btn {
      display: none; position: fixed; left: max(8px, env(safe-area-inset-left)); bottom: 8px; z-index: 50;
      width: 40px; height: 40px; padding: 8px; box-sizing: border-box; border: 1px solid #d9b25f; border-radius: 6px;
      background: rgba(29, 20, 12, 0.75); color: #e9c46a; touch-action: none;
    }
    #fs-btn.show { display: block; }
    #fs-btn svg { display: block; width: 100%; height: 100%; }
    #fs-btn .exit, #fs-btn.on .enter { display: none; }
    #fs-btn.on .exit { display: block; }
  </style>
</head>
<body>
  <div id="game">
    <div id="rotate"><div class="icon">⟳</div>请将设备横置<br>以获得最佳体验</div>
    <!-- 放在全屏目标 #game 内，全屏后仍可点击退出 -->
    <button id="fs-btn" type="button" aria-label="全屏">
      <svg class="enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      <svg class="exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
    </button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
